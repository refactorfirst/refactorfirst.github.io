# Bitbucket Pipelines: build the static export for Bitbucket static hosting.
# The `out/` directory can then be published using the Bitbucket Pages
# add-on or any static host of your choice.

image: node:22

definitions:
  caches:
    bun-deps: node_modules
    next-cache: .next/cache

pipelines:
  branches:
    main:
      - step:
          name: Test
          caches:
            - bun-deps
          script:
            - npm install -g bun
            - bun install
            - bun test tests/unit tests/integration
      - step:
          name: Build static export
          caches:
            - bun-deps
            - next-cache
          script:
            - npm install -g bun
            - bun install
            - NEXT_PUBLIC_HOSTING_ENVIRONMENT=bitbucket bun run build
          artifacts:
            - out/**
