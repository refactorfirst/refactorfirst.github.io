<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Note: frame-ancestors is intentionally served via HTTP header (it is
       ignored in a meta element). Platform deployment docs list the header. -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://esm.sh https://buttons.github.io 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; img-src 'self' https://avatars.githubusercontent.com https://buttons.github.io https://github.githubassets.com data:; connect-src 'self' https://api.github.com https://raw.githubusercontent.com https://cdn.jsdelivr.net https://esm.sh; base-uri 'self';">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <!-- Repository submissions open an issue in this "<owner>/<repo>" project.
       Self-managed GitLab deployments can also set a platform-base-url meta. -->
  <meta name="submission-target" content="refactorfirst/refactorfirst.github.io">
  <title>RefactorFirst - Know Where to Refactor First</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/mvp.css@1.15.0/mvp.css">
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/components.css">
  <!-- Report rendering dependencies (used on /user/repo report pages).
       mustache + DOMPurify are vendored in assets/vendor/; the CDN scripts
       below power the interactive report widgets. -->
  <script defer src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/svg-pan-zoom@3.6.1/dist/svg-pan-zoom.min.js"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/sigma.js/2.4.0/sigma.min.js"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/graphology/0.25.4/graphology.umd.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/graphlib-dot@0.6.4/dist/graphlib-dot.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/3d-force-graph"></script>
</head>
<body>
  <a class="skip-link" href="#app">Skip to content</a>
  <header id="top-menu">
    <nav class="menu-bar" aria-label="Main navigation">
      <a href="/" class="brand" data-link>
        <img src="/assets/logo.png" alt="RefactorFirst logo" class="logo" width="32" height="32">
        <span>RefactorFirst</span>
      </a>
      <div class="menu-search" role="search">
        <input type="search" id="menu-search-input" placeholder="Search repositories..."
               aria-label="Search repositories" autocomplete="off"
               aria-expanded="false" aria-controls="menu-search-results" role="combobox">
        <ul id="menu-search-results" class="search-results" role="listbox" hidden></ul>
      </div>
      <button id="menu-toggle" class="menu-toggle" aria-label="Toggle navigation menu"
              aria-expanded="false" aria-controls="menu-links">&#9776;</button>
      <ul id="menu-links" class="menu-links">
        <li><a href="/" data-link>Home</a></li>
        <li><a href="/add-repo" data-link>Add Your Repo</a></li>
        <li><a href="/getting-started" data-link>Getting Started</a></li>
        <li><a href="/documentation" data-link>Documentation</a></li>
        <li><a href="/faq" data-link>FAQ</a></li>
        <li><a href="/examples" data-link>Examples</a></li>
        <li><a href="/api" data-link>API</a></li>
        <li><a href="/about" data-link>About</a></li>
        <li><a href="/feedback" data-link>Feedback</a></li>
        <li><a href="https://github.com/refactorfirst/refactorfirst" target="_blank" rel="noopener noreferrer">GitHub</a></li>
      </ul>
    </nav>
  </header>
  <main id="app" tabindex="-1">
    <p class="loading" role="status">Loading&hellip;</p>
  </main>
  <footer class="site-footer">
    <p>
      <a href="/privacy-policy" data-link>Privacy Policy</a> &middot;
      <a href="/terms-of-service" data-link>Terms of Service</a> &middot;
      Powered by <a href="https://github.com/refactorfirst/refactorfirst" target="_blank" rel="noopener noreferrer">RefactorFirst</a>
    </p>
  </footer>
  <script type="module" src="/js/main.js"></script>
</body>
</html>
