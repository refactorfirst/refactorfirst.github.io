# User-provided workflow template.
# Copy this file to .github/workflows/refactorfirst-report.yml in your repository
# to regenerate your RefactorFirst report on every merge to the default branch.

name: Generate RefactorFirst Report
on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  generate-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Generate RefactorFirst report
        run: mvn refactorfirst:jsonReport

      - name: Commit report
        run: |
          if [ -f .refactorfirst/refactor-first.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add .refactorfirst/refactor-first.json
            git diff --staged --quiet || git commit -m "Update RefactorFirst report"
            git push
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
